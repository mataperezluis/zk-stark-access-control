[package]
name = "access-zk"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["prover"]
prover = ["dep:getrandom", "dep:serde_json"]

[dependencies]
p3-air = { path = "../../vendor/Plonky3/air" }
p3-baby-bear = { path = "../../vendor/Plonky3/baby-bear" }
p3-blake3 = { path = "../../vendor/Plonky3/blake3" }
p3-challenger = { path = "../../vendor/Plonky3/challenger" }
p3-commit = { path = "../../vendor/Plonky3/commit" }
p3-dft = { path = "../../vendor/Plonky3/dft" }
p3-field = { path = "../../vendor/Plonky3/field" }
p3-fri = { path = "../../vendor/Plonky3/fri" }
p3-matrix = { path = "../../vendor/Plonky3/matrix" }
p3-merkle-tree = { path = "../../vendor/Plonky3/merkle-tree" }
p3-poseidon2 = { path = "../../vendor/Plonky3/poseidon2" }
p3-poseidon2-air = { path = "../../vendor/Plonky3/poseidon2-air" }
p3-symmetric = { path = "../../vendor/Plonky3/symmetric" }
p3-uni-stark = { path = "../../vendor/Plonky3/uni-stark" }
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
getrandom = { version = "0.3", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
blake3 = { version = "1.8", default-features = false }
serde_json = { version = "1", optional = true }

[[bin]]
name = "access-zk"
path = "src/main.rs"
required-features = ["prover"]

[dev-dependencies]
serde_json = "1"

